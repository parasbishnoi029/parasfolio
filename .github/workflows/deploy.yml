name: Deploy Portfolio & Inject API Key

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify secret is present
        env:
          GEMINI_KEY: ${{ secrets.PARASFOLIO_KEY }}
        run: |
          KEY_LEN=${#GEMINI_KEY}
          echo "GEMINI_KEY length: ${KEY_LEN} characters"
          if [ "${KEY_LEN}" -lt 20 ]; then
            echo "::error::secrets.PARASFOLIO_KEY is missing or empty."
            exit 1
          fi

      - name: Safely Inject API Key into chatbot.js
        env:
          GEMINI_KEY: ${{ secrets.PARASFOLIO_KEY }}
        run: |
          # Let's find where chatbot.js actually lives incase it's in a subfolder
          FILE_PATH=$(find . -name "chatbot.js" | head -n 1)
          echo "Found chatbot.js at: ${FILE_PATH}"
          
          if [ -z "${FILE_PATH}" ]; then
            echo "::error::Could not find chatbot.js anywhere in the repository!"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const filePath = process.argv[1];
            let file = fs.readFileSync(filePath, "utf8");
            if (!file.includes("INJECT_API_KEY_HERE")) {
              console.error("Error: INJECT_API_KEY_HERE placeholder not found in " + filePath);
              process.exit(1);
            }
            file = file.replace("INJECT_API_KEY_HERE", process.env.GEMINI_KEY);
            fs.writeFileSync(filePath, file, "utf8");
            console.log("Successfully injected Gemini API key into " + filePath);
          ' "${FILE_PATH}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
