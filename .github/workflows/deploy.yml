name: Deploy Portfolio & Inject API Key

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify secret is present
        env:
          GEMINI_KEY: ${{ secrets.PARASFOLIO_KEY }}
        run: |
          KEY_LEN=${#GEMINI_KEY}
          echo "GEMINI_KEY length: ${KEY_LEN} characters"
          if [ "${KEY_LEN}" -lt 20 ]; then
            echo "::error::secrets.PARASFOLIO_KEY is missing or empty."
            exit 1
          fi

      - name: Directly Inject API Key into chatbot.js
        env:
          GEMINI_KEY: ${{ secrets.PARASFOLIO_KEY }}
        run: |
          # This writes the key directly into the JavaScript file, avoiding sed match errors completely
          sed -i "s|INJECT_API_KEY_HERE|${GEMINI_KEY}|g" chatbot.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
